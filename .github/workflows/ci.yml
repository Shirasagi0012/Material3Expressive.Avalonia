name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Material3Expressive.slnx

      - name: Build
        run: dotnet build Material3Expressive.slnx -c Release --no-restore

      # The library has no test projects yet — headless tests land in phase 1 (see ROADMAP.md).
      # This step picks them up automatically once they exist.
      - name: Test
        shell: bash
        run: |
          mapfile -t projects < <(find src -name '*.Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*')
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No test projects found under src/ yet — skipping."
            exit 0
          fi
          for project in "${projects[@]}"; do
            dotnet test "$project" -c Release --no-build --verbosity normal
          done
