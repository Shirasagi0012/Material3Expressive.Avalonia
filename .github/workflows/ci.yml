name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ContinuousIntegrationBuild: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      material_color_utilities_package_version: ${{ steps.versions.outputs.material_color_utilities_package_version }}
      material_shapes_package_version: ${{ steps.versions.outputs.material_shapes_package_version }}
      material_symbols_package_version: ${{ steps.versions.outputs.material_symbols_package_version }}
      root_package_version: ${{ steps.versions.outputs.root_package_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget update source github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Resolve package versions
        id: versions
        shell: bash
        run: |
          main_base_version="$(dotnet msbuild src/Material3Expressive/Material3Expressive.csproj -getProperty:Version -nologo)"
          shadow_base_version="$(dotnet msbuild modules/MaterialSkiaShadow/MaterialSkiaShadow.csproj -getProperty:Version -nologo)"
          roboto_base_version="$(dotnet msbuild modules/MaterialTypography.Roboto/MaterialTypography.Roboto.csproj -getProperty:Version -nologo)"
          color_base_version="$(dotnet msbuild modules/MaterialColorUtilities/MaterialColorUtilities.Avalonia/MaterialColorUtilities.Avalonia.csproj -getProperty:Version -nologo)"
          contract_base_version="$(dotnet msbuild modules/MaterialColorUtilities/MaterialDesignTokens.Avalonia/MaterialDesignTokens.Avalonia.csproj -getProperty:Version -nologo)"
          shapes_base_version="$(dotnet msbuild modules/MaterialShapes/MaterialShapes/MaterialShapes.csproj -getProperty:Version -nologo)"
          symbols_base_version="$(dotnet msbuild modules/MaterialSymbols/MaterialSymbols.Avalonia.Rounded/MaterialSymbols.Avalonia.Rounded.csproj -getProperty:Version -nologo)"

          if [[ "$shadow_base_version" != "$main_base_version" || "$roboto_base_version" != "$main_base_version" ]]; then
            echo "Root-owned packages must share one base version."
            exit 1
          fi

          if [[ "$contract_base_version" != "$color_base_version" ]]; then
            echo "MaterialDesignTokens.Avalonia and MaterialColorUtilities.Avalonia must share one base version."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            root_package_version="${GITHUB_REF_NAME#v}"
            if [[ "$root_package_version" != "$main_base_version" ]]; then
              echo "Tag version $root_package_version does not match the package version $main_base_version."
              exit 1
            fi

            color_package_version="$color_base_version"
            shapes_package_version="$shapes_base_version"
            symbols_package_version="$symbols_base_version"
          else
            root_package_version="${main_base_version}.ci.g${GITHUB_SHA}"
            color_package_version="${color_base_version}.ci.g$(git -C modules/MaterialColorUtilities rev-parse HEAD)"
            shapes_package_version="${shapes_base_version}.ci.g$(git -C modules/MaterialShapes rev-parse HEAD)"
            symbols_package_version="${symbols_base_version}.ci.g$(git -C modules/MaterialSymbols rev-parse HEAD)"
          fi

          echo "MaterialColorUtilitiesPackageVersion=$color_package_version" >> "$GITHUB_ENV"
          echo "MaterialShapesPackageVersion=$shapes_package_version" >> "$GITHUB_ENV"
          echo "MaterialSymbolsPackageVersion=$symbols_package_version" >> "$GITHUB_ENV"
          echo "RootPackageVersion=$root_package_version" >> "$GITHUB_ENV"

          echo "material_color_utilities_package_version=$color_package_version" >> "$GITHUB_OUTPUT"
          echo "material_shapes_package_version=$shapes_package_version" >> "$GITHUB_OUTPUT"
          echo "material_symbols_package_version=$symbols_package_version" >> "$GITHUB_OUTPUT"
          echo "root_package_version=$root_package_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Material3Expressive.slnx

      - name: Build
        run: dotnet build Material3Expressive.slnx -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          dotnet test modules/MaterialSkiaShadow.Tests/MaterialSkiaShadow.Tests.csproj \
            -c Release --no-build --verbosity normal
          dotnet test tests/Material3Expressive.Tests/Material3Expressive.Tests.csproj \
            -c Release --no-build --verbosity normal

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      MaterialColorUtilitiesPackageVersion: ${{ needs.build.outputs.material_color_utilities_package_version }}
      MaterialShapesPackageVersion: ${{ needs.build.outputs.material_shapes_package_version }}
      MaterialSymbolsPackageVersion: ${{ needs.build.outputs.material_symbols_package_version }}
      RootPackageVersion: ${{ needs.build.outputs.root_package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Authenticate GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget update source github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Restore
        run: dotnet restore Material3Expressive.slnx

      - name: Pack root-owned packages
        shell: bash
        run: |
          dotnet pack src/Material3Expressive/Material3Expressive.csproj \
            -c Release \
            --no-restore \
            -p:GeneratePackageOnBuild=false \
            -p:PackageVersion="$RootPackageVersion" \
            -o artifacts/packages
          dotnet pack modules/MaterialSkiaShadow/MaterialSkiaShadow.csproj \
            -c Release \
            --no-restore \
            -p:GeneratePackageOnBuild=false \
            -p:PackageVersion="$RootPackageVersion" \
            -o artifacts/packages
          dotnet pack modules/MaterialTypography.Roboto/MaterialTypography.Roboto.csproj \
            -c Release \
            --no-restore \
            -p:GeneratePackageOnBuild=false \
            -p:PackageVersion="$RootPackageVersion" \
            -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ github.run_id }}
          path: artifacts/packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish NuGet packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages were produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
