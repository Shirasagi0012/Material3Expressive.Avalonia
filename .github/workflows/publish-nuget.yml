name: Publish NuGet Packages

on:
    workflow_dispatch:
        inputs:
            nuget_user:
                description: NuGet.org username for Trusted Publishing
                default: Shirasagi
                required: true
                type: string

permissions:
    contents: read
    id-token: write

concurrency:
    group: nuget-publication
    cancel-in-progress: false

env:
    PACKAGE_OUTPUT_DIR: artifacts/nuget
    NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout selected ref
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Pack all libraries with their project versions
              shell: bash
              run: |
                  set -euo pipefail
                  projects=(
                    modules/ComposeAnimation/ComposeAnimation.Runtime/ComposeAnimation.Runtime.csproj
                    modules/ComposeAnimation/ComposeAnimation.Avalonia/ComposeAnimation.Avalonia.csproj
                    modules/ComposeAnimation/ComposeAnimation.TestSupport/ComposeAnimation.TestSupport.csproj
                    modules/MaterialShapes/MaterialShapes/MaterialShapes.csproj
                    modules/MaterialSkiaShadow/MaterialSkiaShadow.csproj
                    modules/MaterialTypography.Roboto/MaterialTypography.Roboto.csproj
                    modules/SmoothScroll.Avalonia/src/SmoothScroll.Avalonia.Interaction/SmoothScroll.Avalonia.Interaction.csproj
                    modules/SmoothScroll.Avalonia/src/SmoothScroll.Avalonia.Controls/SmoothScroll.Avalonia.Controls.csproj
                    src/Material3Expressive/Material3Expressive.csproj
                  )
                  for project in "${projects[@]}"; do
                    dotnet pack "$project" --configuration Release --output "$PACKAGE_OUTPUT_DIR"
                  done

            - name: Upload package artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: NuGet.${{ github.sha }}
                  path: |
                      ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
                      ${{ env.PACKAGE_OUTPUT_DIR }}/*.snupkg
                  if-no-files-found: error

            - name: NuGet login
              id: login
              uses: NuGet/login@v1
              with:
                  user: ${{ inputs.nuget_user }}

            - name: Push packages in dependency order
              shell: bash
              env:
                  NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
              run: |
                  set -euo pipefail
                  packages=(
                    Shirasagi0012.ComposeAnimation.Runtime
                    Shirasagi0012.ComposeAnimation.Avalonia
                    Shirasagi0012.ComposeAnimation.TestSupport
                    Shirasagi0012.MaterialShapes
                    Shirasagi0012.Material3Expressive.Avalonia.Shadow
                    Shirasagi0012.MaterialTypography.Roboto
                    Shirasagi0012.SmoothScroll.Avalonia.Interaction
                    Shirasagi0012.SmoothScroll.Avalonia
                    Shirasagi0012.Material3Expressive.Avalonia
                  )
                  for package in "${packages[@]}"; do
                    for package_file in "$PACKAGE_OUTPUT_DIR/$package".[0-9]*.nupkg; do
                      dotnet nuget push "$package_file" \
                        --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" \
                        --skip-duplicate
                    done
                  done
